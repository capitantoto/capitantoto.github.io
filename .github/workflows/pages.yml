# Builds the site with Typst's HTML export and publishes out/ to GitHub Pages on every push to master and once a day.
name: pages

on:
  push:
    branches: [master]
  # Daily rebuild at 08:00 Buenos Aires time releases posts scheduled for that day.
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      # The Makefile skips a post that is missing or fails to compile so local drafts don't block the build; in CI either is fatal.
      - run: make | tee build.txt
        shell: bash  # explicit bash adds -o pipefail, so a make failure is not masked by tee
      - name: Fail on skipped posts
        run: |
          if grep -q "^skip" build.txt; then exit 1; fi
          if grep -lE "(^|: )error:" build/log/*.log; then exit 1; fi
          test "$(ls out/posts/*.html | wc -l)" -gt 0
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
